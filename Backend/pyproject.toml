[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "kshitishkumarpanda34@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.28.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "google>=3.0.0",
    "pytest>=9.1.1",
]
