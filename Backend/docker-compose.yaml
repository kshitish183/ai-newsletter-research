services:
  web:
    build: .
    container_name: ai-newsletter-backend
    env_file:
      - .env
    networks:
      - backend-app
    volumes:
      - chroma-data:/app/data/chroma
    restart: unless-stopped  
    command: sh -c "uvicorn main:app --reload --port=8000 --host=0.0.0.0"
    ports:
      - "8000:8000"
networks:
  backend-app:
    driver: bridge
volumes:
  chroma-data:
